version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api/v1
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CORS_ORIGIN=http://localhost:5173
      - INTERNAL_SERVICE_TOKEN=careercraft_internal_secret_token_2026
      - AI_MOCK_MODE=false
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - INTERNAL_SERVICE_TOKEN=careercraft_internal_secret_token_2026
      - LITELLM_URL=http://litellm-gateway:4001
    depends_on:
      - litellm-gateway

  litellm-gateway:
    image: ghcr.io/berriai/litellm:main-v1.40.0
    ports:
      - "4001:4001"
    volumes:
      - ./backend/litellm.config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4001"]

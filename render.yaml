services:
  # 1. Fastify BFF Web Service
  - type: web
    name: careercraft-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: https://careercraft-platform.vercel.app
      - key: RATE_LIMIT_MAX
        value: 100
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: AI_MOCK_MODE
        value: "false"

  # 2. Python FastAPI + LangGraph AI Microservice (Optional Dedicated Tier)
  - type: web
    name: careercraft-ai-service
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: careercraft-backend
          envVarKey: INTERNAL_SERVICE_TOKEN

name: CareerCraft Enterprise CI/CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Production Quality Gate (Tests, Lint, Build & Security)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node.js v24 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Run CI Runtime Preflight Gate
        run: node scripts/ci-preflight.js

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python AI Microservice Dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Pytest Suite (13 Tests)
        working-directory: ai-service
        run: PYTHONPATH=. python -m pytest

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Security Vulnerability Dependency Audit Gate
        run: |
          npm audit --audit-level=high
          (cd backend && npm audit --audit-level=high)

      - name: Run Internationalization Governance Check
        run: npm run i18n:check

      - name: Run UI Architecture Audit
        run: npm run ui:audit

      - name: Run Architectural Audit Gate
        run: npm run arch:audit

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Run Full Vitest Test Suite
        run: npm run test

      - name: Build Fastify Node.js BFF TypeScript Target
        working-directory: backend
        run: npm run build

      - name: Build React Vite Production Asset Bundle
        run: npm run build

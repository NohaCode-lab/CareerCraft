name: CareerCraft Enterprise CI/CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Production Quality Gate (Tests, Lint, Build & Security)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js v24 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Run CI Runtime Preflight Gate
        run: node scripts/ci-preflight.js

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python AI Microservice Dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Pytest Suite (13 Tests)
        working-directory: ai-service
        run: PYTHONPATH=. python -m pytest

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Security Vulnerability Dependency Audit Gate
        run: |
          npm audit --audit-level=high
          (cd backend && npm audit --audit-level=high)

      - name: Run Authoritative System Release Validation Gate
        run: npm run validate

      - name: Build Fastify Node.js BFF TypeScript Target
        working-directory: backend
        run: npm run build
